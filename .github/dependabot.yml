version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The image's base layers age on their own schedule, and a stale one ships
  # whatever CVEs Debian has patched since. Majors are held back: the Node tag
  # names an LTS line, and the first bump offered moved it to a release that is
  # not one yet. Moving either runtime is a decision, not a refresh.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
