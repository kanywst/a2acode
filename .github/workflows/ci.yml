name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync (lockfile must be current)
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

  # The lock pins one point inside each declared range, but a PyPI install
  # resolves afresh: the newest releases today, or any floor a user's other
  # pins force. Testing only the lock let a floor admit a release the acp
  # backend breaks on, and an upstream release break a published version with
  # nothing in CI noticing until the lock was bumped. The schedule is what
  # catches the second case on a week with no commits.
  resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            python-version: "3.11"
          - resolution: highest
            python-version: "3.14"
    name: resolution (${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (resolved afresh, ignoring the lock)
        run: uv sync --dev --upgrade --resolution ${{ matrix.resolution }}

      - name: Show what resolved
        run: uv pip list | grep -iE '^(a2a-sdk|agent-client-protocol|claude-agent-sdk|uvicorn|httpx|typer) '

      - name: Test
        run: uv run --no-sync pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The Dockerfile installs the wheel rather than the source tree, so the
      # context has to hold one before the build runs.
      - name: Build the wheel
        run: uv build --wheel

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `load` takes a single architecture, so the runnable image is built
      # separately from the pair the release ships.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: a2acode:ci

      # Neither pushed nor loaded, only built: the base digests have to resolve
      # on both legs, which a one-architecture build would not notice until a
      # tag was already half-released.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64

      # The echo backend needs no credential, and the card path is exempt from
      # caller auth, so one request proves the whole image serves.
      - name: Serve and fetch the agent card
        run: |
          docker run -d --name a2acode -p 9100:9100 a2acode:ci \
            serve --backend echo --host 0.0.0.0
          for i in $(seq 30); do
            curl -fsS http://localhost:9100/.well-known/agent-card.json -o card.json && break
            sleep 1
          done
          docker logs a2acode
          test -s card.json
          python3 -c "import json; print(json.load(open('card.json'))['name'])"
          test "$(docker exec a2acode id -u)" = 1000

      # The default backend launches its adapter with npx, and echo never does.
      # Without this, Node arriving broken out of the multi-stage copy would
      # pass CI and fail for the first real caller instead.
      - name: Run the agent launcher the acp backend uses
        run: |
          docker exec a2acode node --version
          docker exec a2acode npm --version
          # Fetching a package rather than just reporting a version, because it
          # is the download cache under HOME that uid 1000 has to be able to
          # write. Any tiny package with a CLI would do.
          docker exec a2acode npx --yes semver@7.6.3 1.2.3 --range ">=1.0.0"

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2
