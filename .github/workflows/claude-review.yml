name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    # Dependabot's runs read a separate secret store, so this repository's token
    # arrives empty there; a version bump has nothing for this review to say
    # anyway, so skip it rather than mirror a subscription token into that store.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      # Nothing here needs an authenticated git: the review reads the tree and
      # reaches the API through `gh`. The action replaces whatever credential
      # checkout left behind with its own anyway, so persisting one only widens
      # what the agent can pick up out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            a2acode exposes Claude Code as an A2A protocol agent server, mapping tool
            progress, file diffs and permission prompts onto the protocol.

            Do not repeat what CI already does. Lint and the tests run on this PR already.

            Look for what only a reader can catch:

            1. The permission boundary. This hands a remote caller a lane into an agent that
               edits files and runs commands. A permission prompt that is auto-answered,
               bypassed, or mapped onto the protocol in a way that loses the user's decision
               is the most serious defect possible here.

            2. What crosses the wire. File diffs and tool output can carry secrets, absolute
               paths and environment values. Check what a remote peer ends up seeing.

            3. Input from the peer. Task payloads are untrusted. Anything reaching a shell,
               a path join or a file read needs to survive a hostile one.

            4. Protocol fidelity. A2A message and state shapes come from the specification.
               An invented field works locally and fails against any other implementation.

            5. Long-running work. Cancellation, timeouts and a client that disconnects
               mid-task should not leave an agent running unattended.

            Post findings as inline comments on the lines they concern. Be
            specific and cite `file:line`. If the diff is clean against all of
            the above, say so in one line rather than manufacturing nits.

            Post the summary as one top-level comment, and start the command
            with exactly this prefix:

            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body ...

            The only write this job is allowed is a comment on this pull
            request. Any other form of the command is denied and the summary
            goes nowhere.

          # The diff under review is the untrusted input here, so the one write
          # granted is pinned to the pull request that triggered the run: a
          # comment planted in a diff cannot redirect it at another one.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }}:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
